[project]
name = "som-code-python"
version = "0.1.0"
description = "Python ecosystem corpus for SOM: executable oracle families, snippet ISA, and their gates"
readme = "README.md"
requires-python = ">=3.12"
# The third-party libraries the curated candidates and fixtures import: the
# union of every family's `decompiled.imports` plus what the fixtures use.
dependencies = [
    "aiohttp>=3.14",
    "beautifulsoup4>=4.15",
    "celery>=5.6",
    "click>=8.5",
    "cryptography>=50",
    "fastapi>=0.118",
    "httpx>=0.28",
    "hypothesis>=6",
    "lxml>=6.1",
    "numpy>=2.5",
    "pandas",
    "pydantic>=2.11",
    "pyjwt>=2.14",
    "pytest>=9",
    "pyyaml>=6",
    "redis>=8",
    "requests>=2.34",
    "scikit-learn",
    "sqlalchemy>=2.0.44",
    "typer>=0.27",
    "urllib3>=2.8",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pylint>=4",
    "ruff>=0.14",
    "types-pyyaml",
    "types-requests",
    "lxml-stubs",
    "celery-types",
    "pandas-stubs",
]

[tool.uv]
package = false

# The code-quality gate (`scripts/verify_quality.py`) reads the three tool
# tables below and nothing else. Every exception names why the community
# default does not fit a corpus candidate.
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "PL", "RUF"]
# PLR2004: status codes and limits are the contract the fixture asserts, and
# `decompile_gold.py` measures the literals into `decompiled.status_codes`.
ignore = ["PLR2004"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and Typer declare parameters through calls in defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.lint.pep8-naming]
# scikit-learn and NumPy name a feature matrix `X` (and `X_train`, `X_test`).
extend-ignore-names = ["X", "X_*"]

[tool.mypy]
strict = true
python_version = "3.12"

# scikit-learn ships neither inline types nor a maintained stub package.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.12"
# lxml is a C extension; let pylint import it to see its members.
extension-pkg-allow-list = ["lxml"]

[tool.pylint.basic]
# scikit-learn and NumPy name a feature matrix `X` (and `X_train`, `X_test`).
good-names-rgxs = ["^X(_[a-z0-9_]+)?$"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint."messages control"]
# too-few-public-methods: pydantic models, dataclasses, and protocol classes
# are data carriers. duplicate-code: six candidates of one family are near
# copies by design. not-callable: mypy --strict checks every call against real
# types, while pylint's inference misreads `sqlalchemy.func.count()`.
disable = ["too-few-public-methods", "duplicate-code", "not-callable"]
