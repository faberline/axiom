[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "som-code-python"
version = "0.1.0"
description = "Python domain expert corpus and generation scripts for SOM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "som-core",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
