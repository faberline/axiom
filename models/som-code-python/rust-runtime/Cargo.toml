[package]
name = "som-rust-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
