[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "som-core"
version = "0.1.0"
description = "Core MLX engine and CLI for Structured Outcome Models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx",
    "mlx-lm",
    "typer",
]

[project.scripts]
som = "som_core.cli:app"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
