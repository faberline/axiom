name: tape-release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Tape semver without the tape@ prefix.
        required: true
        type: string
      commit:
        description: Exact landed main commit to build and test.
        required: true
        type: string

concurrency:
  group: tape-release-candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  identity:
    name: candidate identity
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      pr_number: ${{ steps.identity.outputs.pr_number }}
      pr_url: ${{ steps.identity.outputs.pr_url }}
      workflow_id: ${{ steps.identity.outputs.workflow_id }}
      run_url: ${{ steps.identity.outputs.run_url }}
      source_ref: ${{ steps.identity.outputs.source_ref }}
      workflow_ref: ${{ steps.identity.outputs.workflow_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove exact landed main candidate identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "candidate must dispatch main" >&2; exit 1; }
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit input" >&2; exit 1; }
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version input" >&2; exit 1; }
          [[ "$REQUESTED_COMMIT" == "$GITHUB_SHA" ]] || { echo "input commit is not dispatch SHA" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || { echo "checkout SHA mismatch" >&2; exit 1; }
          [[ "$WORKFLOW_REF" == "${GITHUB_REPOSITORY}/.github/workflows/tape-release-candidate.yml@refs/heads/main" ]] || { echo "candidate workflow ref mismatch" >&2; exit 1; }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "candidate is not landed on main" >&2; exit 1; }
          cargo_version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' apps/tape/Cargo.toml | head -n1)"
          [[ "$cargo_version" == "$REQUESTED_VERSION" ]] || { echo "Cargo version mismatch" >&2; exit 1; }
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/tape@${cargo_version}" >/dev/null 2>&1
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "the exact release tag already exists" >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "cannot prove exact release tag absence (git ls-remote exit ${tag_status})" >&2
              exit 1
              ;;
          esac
          release_query="query(\$owner:String!, \$name:String!, \$tag:String!) { repository(owner:\$owner, name:\$name) { release(tagName:\$tag) { id } } }"
          release_json="$(gh api graphql -f query="$release_query" -f owner="${GITHUB_REPOSITORY_OWNER}" -f name="${GITHUB_REPOSITORY#*/}" -f tag="tape@${cargo_version}")"
          [[ "$(jq -r '.data.repository.release | if . == null then "absent" else "present" end' <<<"$release_json")" == absent ]] || { echo "the exact GitHub Release already exists" >&2; exit 1; }
          prs="$(gh api --paginate -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" | jq -cs --arg sha "$GITHUB_SHA" '[.[][] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha)]')"
          [[ "$(jq 'length' <<<"$prs")" == 1 ]] || { echo "expected one merged main PR" >&2; exit 1; }
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tape-release-candidate.yml" --jq '.id')"
          [[ "$workflow_id" =~ ^[0-9]+$ ]] || { echo "workflow id missing" >&2; exit 1; }
          {
            echo "commit=$GITHUB_SHA"
            echo "version=$cargo_version"
            echo "tag=tape@$cargo_version"
            echo "pr_number=$(jq -r '.[0].number' <<<"$prs")"
            echo "pr_url=$(jq -r '.[0].html_url' <<<"$prs")"
            echo "workflow_id=$workflow_id"
            echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
            echo "source_ref=$GITHUB_REF"
            echo "workflow_ref=$WORKFLOW_REF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: identity
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14, cross: false, musl: false }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: false, musl: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true, musl: false }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: false, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, cross: false, musl: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux cross toolchain
        if: matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: Install musl toolchain
        if: matrix.musl
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-candidate-${{ matrix.target }}
      - name: Build exact release candidate binary
        shell: bash
        run: cargo build --release --locked -p tape --bin tape --features "operator backup self-update issue" --target ${{ matrix.target }}
      - name: Package archive and checksum sidecar
        shell: bash
        run: |
          set -euo pipefail
          name="tape-${{ matrix.target }}"
          mkdir -p "pkg/${name}" out
          cp "target/${{ matrix.target }}/release/tape" "pkg/${name}/tape"
          cp apps/tape/README.md "pkg/${name}/README.md"
          tar -C pkg -czf "out/${name}.tar.gz" "$name"
          (
            cd out
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
            else
              sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
            fi
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tape-candidate-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/tape-${{ matrix.target }}.tar.gz
            out/tape-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          overwrite: false

  tape-release-gates:
    name: verify exact Tape release gates
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-candidate-release-gates
      - name: Run declared Tape gates
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/tape/scripts/verify-release-contract.py --self-test
          cargo test --locked -p tape
          cargo test --locked -p tape --features operator,backup
          cargo test --release --locked -p tape --test tape_perf_gate
          uv run --python 3.13 --no-project scripts/meta/project_docs_contract.py check apps/tape --format json
          bash scripts/raft-implementor-build.sh
          bash apps/tape/e2e/raft_soak.sh

  ghcr-image-and-attest:
    name: build candidate image and attest
    needs: [identity, build]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      image_repo: ${{ steps.tags.outputs.image_repo }}
      candidate_tag: ${{ steps.tags.outputs.candidate_tag }}
      root_digest: ${{ steps.push.outputs.digest }}
      amd64_digest: ${{ steps.platform_digests.outputs.amd64_digest }}
      arm64_digest: ${{ steps.platform_digests.outputs.arm64_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-x86_64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}
          path: pkg/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-aarch64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}
          path: pkg/arm64
      - name: Verify container binaries and extract staged inputs
        shell: bash
        run: |
          set -euo pipefail
          for dir in pkg/amd64 pkg/arm64; do
            sidecar="$(find "$dir" -maxdepth 1 -name '*.sha256' -type f -print -quit)"
            archive="${sidecar%.sha256}"
            [[ -n "$sidecar" && -f "$archive" ]] || { echo "missing staged pair" >&2; exit 1; }
            if command -v sha256sum >/dev/null 2>&1; then (cd "$dir" && sha256sum -c "${sidecar##*/}"); else (cd "$dir" && shasum -a 256 -c "${sidecar##*/}"); fi
          done
          mkdir -p dist/linux/amd64 dist/linux/arm64
          tar -xzf pkg/amd64/tape-x86_64-unknown-linux-musl.tar.gz -C dist/linux/amd64 --strip-components=1 tape-x86_64-unknown-linux-musl/tape
          tar -xzf pkg/arm64/tape-aarch64-unknown-linux-musl.tar.gz -C dist/linux/arm64 --strip-components=1 tape-aarch64-unknown-linux-musl/tape
          chmod +x dist/linux/amd64/tape dist/linux/arm64/tape
          amd64_file="$(file -b dist/linux/amd64/tape)"
          arm64_file="$(file -b dist/linux/arm64/tape)"
          [[ "$amd64_file" == *"ELF 64-bit"* && "$amd64_file" == *"x86-64"* ]] || { echo "wrong amd64 binary: $amd64_file" >&2; exit 1; }
          [[ "$arm64_file" == *"ELF 64-bit"* && "$arm64_file" == *"ARM aarch64"* ]] || { echo "wrong arm64 binary: $arm64_file" >&2; exit 1; }
      - name: Resolve run-scoped candidate image identity
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "image_repo=ghcr.io/chrischeng-c4/tape"
            echo "candidate_tag=release-candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push only the candidate index
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/tape/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            SOURCE=staged
          tags: ${{ steps.tags.outputs.image_repo }}:${{ steps.tags.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.identity.outputs.commit }}
            org.opencontainers.image.version=${{ needs.identity.outputs.version }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
      - name: Extract exact two platform child digests
        id: platform_digests
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.push.outputs.digest }}"
          raw="$(docker buildx imagetools inspect --raw "${{ steps.tags.outputs.image_repo }}@${root}")"
          jq -e '(.manifests | type == "array" and length == 2) and all(.manifests[]; .platform.os == "linux" and (.platform | has("variant") | not) and (.platform.architecture == "amd64" or .platform.architecture == "arm64") and (.digest | test("^sha256:[0-9a-f]{64}$"))) and ([.manifests[].platform.architecture] | sort == ["amd64","arm64"]) and ([.manifests[].digest] | unique | length == 2)' <<<"$raw" >/dev/null || { echo "invalid candidate image index" >&2; exit 1; }
          amd64="$(jq -er '.manifests[] | select(.platform.architecture == "amd64") | .digest' <<<"$raw")"
          arm64="$(jq -er '.manifests[] | select(.platform.architecture == "arm64") | .digest' <<<"$raw")"
          [[ "$root" != "$amd64" && "$root" != "$arm64" && "$amd64" != "$arm64" ]] || { echo "image digests must be distinct" >&2; exit 1; }
          echo "amd64_digest=$amd64" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign candidate root index with keyless cosign
        shell: bash
        run: cosign sign --yes "${{ steps.tags.outputs.image_repo }}@${{ steps.push.outputs.digest }}"
      - name: Attest candidate root provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image_repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Generate SPDX SBOM for linux/amd64
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.tags.outputs.image_repo }}@${{ steps.platform_digests.outputs.amd64_digest }}
          format: spdx-json
          syft-version: v1.51.0
          output-file: spdx-amd64.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Attest linux/amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image_repo }}
          subject-digest: ${{ steps.platform_digests.outputs.amd64_digest }}
          sbom-path: spdx-amd64.json
          push-to-registry: true
          create-storage-record: false
      - name: Generate SPDX SBOM for linux/arm64
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.tags.outputs.image_repo }}@${{ steps.platform_digests.outputs.arm64_digest }}
          format: spdx-json
          syft-version: v1.51.0
          output-file: spdx-arm64.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Attest linux/arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image_repo }}
          subject-digest: ${{ steps.platform_digests.outputs.arm64_digest }}
          sbom-path: spdx-arm64.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tape-candidate-sboms-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            spdx-amd64.json
            spdx-arm64.json
          if-no-files-found: error
          overwrite: false

  manifest:
    name: bind candidate inputs
    needs: [identity, build, ghcr-image-and-attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-aarch64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-aarch64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-x86_64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-aarch64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-sboms-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Write bound preflight manifest
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | awk '{print $1}'; else shasum -a 256 "$1" | awk '{print $1}'; fi; }
          artifacts='[]'
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            archive="tape-${target}.tar.gz"
            sidecar="${archive}.sha256"
            [[ -f "$archive" && -f "$sidecar" ]] || { echo "missing archive pair: $target" >&2; exit 1; }
            artifacts="$(jq -c --arg target "$target" --arg archive "$archive" --arg archive_sha "$(sha "$archive")" --arg sidecar "$sidecar" --arg sidecar_sha "$(sha "$sidecar")" '. + [{target:$target,archive:$archive,archive_sha256:$archive_sha,sidecar:$sidecar,sidecar_sha256:$sidecar_sha}]' <<<"$artifacts")"
          done
          jq -nc --arg repository "$GITHUB_REPOSITORY" --arg workflow_path '.github/workflows/tape-release-candidate.yml' --argjson workflow_id '${{ needs.identity.outputs.workflow_id }}' --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg run_url '${{ needs.identity.outputs.run_url }}' --arg source_ref '${{ needs.identity.outputs.source_ref }}' --arg workflow_ref '${{ needs.identity.outputs.workflow_ref }}' --arg commit '${{ needs.identity.outputs.commit }}' --arg version '${{ needs.identity.outputs.version }}' --arg tag '${{ needs.identity.outputs.tag }}' --arg candidate_tag '${{ needs.ghcr-image-and-attest.outputs.candidate_tag }}' --argjson pr_number '${{ needs.identity.outputs.pr_number }}' --arg pr_url '${{ needs.identity.outputs.pr_url }}' --arg image_repo '${{ needs.ghcr-image-and-attest.outputs.image_repo }}' --arg root_digest '${{ needs.ghcr-image-and-attest.outputs.root_digest }}' --arg amd64_digest '${{ needs.ghcr-image-and-attest.outputs.amd64_digest }}' --arg arm64_digest '${{ needs.ghcr-image-and-attest.outputs.arm64_digest }}' --argjson artifacts "$artifacts" --arg amd64_sbom "$(sha spdx-amd64.json)" --arg arm64_sbom "$(sha spdx-arm64.json)" '{schema:"cclab.tape.candidate-manifest.v1",repository:$repository,workflow_path:$workflow_path,workflow_id:$workflow_id,run_id:$run_id,run_attempt:$run_attempt,run_url:$run_url,source_ref:$source_ref,workflow_ref:$workflow_ref,commit:$commit,version:$version,tag:$tag,candidate_tag:$candidate_tag,pr:{number:$pr_number,url:$pr_url},image:{repository:$image_repo,root_digest:$root_digest,amd64_digest:$amd64_digest,arm64_digest:$arm64_digest},artifacts:$artifacts,sboms:{amd64:{file:"spdx-amd64.json",sha256:$amd64_sbom},arm64:{file:"spdx-arm64.json",sha256:$arm64_sbom}}}' > candidate-manifest.json
          if command -v sha256sum >/dev/null 2>&1; then sha256sum candidate-manifest.json > candidate-manifest.json.sha256; else shasum -a 256 candidate-manifest.json > candidate-manifest.json.sha256; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tape-candidate-manifest-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/candidate-manifest.json
            candidate/candidate-manifest.json.sha256
          if-no-files-found: error
          overwrite: false

  verify-candidate:
    name: verify exact candidate gates
    needs: [identity, manifest, ghcr-image-and-attest]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR with read-only job access
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-aarch64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-aarch64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-x86_64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-aarch64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-sboms-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-manifest-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Verify full run-scoped candidate supply chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apps/tape/scripts/verify-release-candidate.sh \
            --repo chrischeng-c4/axiom \
            --version "${{ needs.identity.outputs.version }}" \
            --commit "${{ needs.identity.outputs.commit }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --manifest candidate/candidate-manifest.json \
            --manifest-sidecar candidate/candidate-manifest.json.sha256 \
            --artifacts-dir candidate \
            --image "${{ needs.ghcr-image-and-attest.outputs.image_repo }}@${{ needs.ghcr-image-and-attest.outputs.root_digest }}" \
            --candidate-tag "${{ needs.ghcr-image-and-attest.outputs.candidate_tag }}" \
            --amd64-digest "${{ needs.ghcr-image-and-attest.outputs.amd64_digest }}" \
            --arm64-digest "${{ needs.ghcr-image-and-attest.outputs.arm64_digest }}" \
            --mode full

  verify-libraries:
    name: verify service and Raft library gates
    needs: [identity]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tape-candidate-library-gates
      - name: Run required service and Raft library gates without GKE
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/faberline-core-test.sh service-k8s storage-durable service-backup raft-core raft-runtime
          cargo test --locked -p relay --test raft_cluster
          bash scripts/raft-implementor-build.sh

  kind-amd64:
    name: kind e2e (amd64)
    needs: [identity, verify-candidate, verify-libraries, ghcr-image-and-attest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
      - name: Assert native x86_64 runner architecture
        shell: bash
        run: test "$(uname -m)" = x86_64
      - name: Install verified kind v0.32.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64 -o /tmp/kind
          echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind' | sha256sum -c -
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - name: Run prebuilt candidate kind e2e
        shell: bash
        run: |
          set -euo pipefail
          TAPE_E2E_IMAGE_MODE=prebuilt \
          TAPE_E2E_IMAGE="${{ needs.ghcr-image-and-attest.outputs.image_repo }}@${{ needs.ghcr-image-and-attest.outputs.root_digest }}" \
          TAPE_E2E_EXPECTED_VERSION="${{ needs.identity.outputs.version }}" \
          TAPE_E2E_EXPECTED_RUNTIME_DIGEST="${{ needs.ghcr-image-and-attest.outputs.amd64_digest }}" \
          bash apps/tape/scripts/kind-e2e.sh

  kind-arm64:
    name: kind e2e (arm64)
    needs: [identity, verify-candidate, verify-libraries, ghcr-image-and-attest]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
      - name: Assert native aarch64 runner architecture
        shell: bash
        run: test "$(uname -m)" = aarch64
      - name: Install verified kind v0.32.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-arm64 -o /tmp/kind
          echo 'b92cd615e97585de8ddade28ed5cd7feb4248d717c233eea5b03c37298900f5d  /tmp/kind' | sha256sum -c -
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - name: Run prebuilt candidate kind e2e
        shell: bash
        run: |
          set -euo pipefail
          TAPE_E2E_IMAGE_MODE=prebuilt \
          TAPE_E2E_IMAGE="${{ needs.ghcr-image-and-attest.outputs.image_repo }}@${{ needs.ghcr-image-and-attest.outputs.root_digest }}" \
          TAPE_E2E_EXPECTED_VERSION="${{ needs.identity.outputs.version }}" \
          TAPE_E2E_EXPECTED_RUNTIME_DIGEST="${{ needs.ghcr-image-and-attest.outputs.arm64_digest }}" \
          bash apps/tape/scripts/kind-e2e.sh

  result:
    name: final candidate receipt
    needs: [identity, build, tape-release-gates, manifest, ghcr-image-and-attest, verify-candidate, verify-libraries, kind-amd64, kind-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-aarch64-apple-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-aarch64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-x86_64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-aarch64-unknown-linux-musl-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-sboms-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tape-candidate-manifest-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Verify exact preflight manifest sidecar
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c candidate-manifest.json.sha256
          else
            shasum -a 256 -c candidate-manifest.json.sha256
          fi
      - name: Bind all successful job conclusions into final receipt
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          jq -e '.schema == "cclab.tape.candidate-manifest.v1"' candidate-manifest.json >/dev/null
          jq -c '. + {jobs:{identity:"${{ needs.identity.result }}",build:"${{ needs.build.result }}","tape-release-gates":"${{ needs.tape-release-gates.result }}",manifest:"${{ needs.manifest.result }}","ghcr-image-and-attest":"${{ needs.ghcr-image-and-attest.result }}","verify-candidate":"${{ needs.verify-candidate.result }}","verify-libraries":"${{ needs.verify-libraries.result }}","kind-amd64":"${{ needs.kind-amd64.result }}","kind-arm64":"${{ needs.kind-arm64.result }}",result:"success"}}' candidate-manifest.json > final-candidate-manifest.json
          if command -v sha256sum >/dev/null 2>&1; then sha256sum final-candidate-manifest.json > final-candidate-manifest.json.sha256; else shasum -a 256 final-candidate-manifest.json > final-candidate-manifest.json.sha256; fi
      - name: Verify final receipt as local fixture only
        shell: bash
        run: |
          set -euo pipefail
          apps/tape/scripts/verify-release-candidate.sh \
            --repo chrischeng-c4/axiom \
            --version "${{ needs.identity.outputs.version }}" \
            --commit "${{ needs.identity.outputs.commit }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --manifest candidate/final-candidate-manifest.json \
            --manifest-sidecar candidate/final-candidate-manifest.json.sha256 \
            --artifacts-dir candidate \
            --mode local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tape-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/tape-*.tar.gz
            candidate/tape-*.tar.gz.sha256
            candidate/spdx-amd64.json
            candidate/spdx-arm64.json
            candidate/final-candidate-manifest.json
            candidate/final-candidate-manifest.json.sha256
          if-no-files-found: error
          overwrite: false
