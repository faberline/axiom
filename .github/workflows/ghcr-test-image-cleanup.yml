# Prunes stale sha-* dev/test images (the *-test-image.yml workflows:
# sift, and the gke-acceptance harness apps keep/defer/relay/loom; #2513) so
# the GHCR container registry doesn't grow unbounded — GHCR has no built-in
# lifecycle/expiry rules.
#
# Release-line tags (semver + `latest`) are NEVER touched. This job does not
# rely on age/rank filtering alone for that guarantee: a version is only
# ever a delete CANDIDATE if it has at least one tag and EVERY tag on it
# matches `^sha-[0-9a-f]{12}$` (untagged/manifest-list-child versions and
# every semver/`latest` version fail that test and are skipped). The pattern
# is re-checked a second time immediately before each delete call as
# defense in depth, so a bug in the listing/ranking logic above still can't
# reach a protected tag.
#
# Policy per package (sift, keep, defer, relay, loom):
#   - candidate = every tag on the version matches ^sha-[0-9a-f]{12}$
#   - keep      = newest 10 versions by created_at, regardless of age
#   - delete    = candidate AND NOT in the newest 10 AND older than 14 days
#
# actions/delete-package-versions@v5 was considered but can't express this
# safely: it has no "older than N days" filter, so it can't combine the
# age cutoff with the keep-newest-10 rule and the tag-pattern guard in one
# safe pass — hence the small `gh api` script below instead.
name: ghcr-test-image-cleanup

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  packages: write

jobs:
  cleanup:
    name: cleanup (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sift, keep, defer, relay, loom]
    env:
      # GITHUB_TOKEN with `packages: write` can list/delete container
      # versions linked to this repository in the common case. If GitHub's
      # token scoping for this repo owner ever rejects the delete calls
      # below with 403, add a repo secret `GHCR_CLEANUP_TOKEN` (a PAT with
      # `read:packages` + `delete:packages`) — it's preferred automatically
      # when present, no workflow edit required.
      GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ matrix.package }}
      KEEP_NEWEST: 10
      MAX_AGE_DAYS: 14
      TAG_PATTERN: '^sha-[0-9a-f]{12}$'
    steps:
      - name: Determine package API base (user vs organization owner)
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          owner_type="$(gh api "repos/${{ github.repository }}" --jq .owner.type)"
          case "${owner_type}" in
            Organization) base="orgs/${OWNER}" ;;
            User)         base="users/${OWNER}" ;;
            *) echo "unexpected repository owner type: ${owner_type}" >&2; exit 1 ;;
          esac
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: List and delete stale sha-* versions
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.owner.outputs.base }}"
          now_epoch="$(date -u +%s)"
          cutoff_epoch=$(( now_epoch - MAX_AGE_DAYS * 86400 ))

          echo "Package: ${PACKAGE}"
          echo "Keeping newest ${KEEP_NEWEST} versions regardless of age."
          echo "Deleting sha-* candidates ranked beyond that AND older than ${MAX_AGE_DAYS} days."

          # Collect every page, newest-first (explicit sort — don't rely on
          # the API's default ordering). `--method GET` is load-bearing:
          # without it, gh api treats `-f` fields as a POST body and the
          # versions endpoint answers 404 for POST — which reads exactly like
          # a token-scope failure and cost a round of PAT debugging.
          raw="$(gh api --paginate --method GET -f per_page=100 \
            "${base}/packages/container/${PACKAGE}/versions" \
            --jq '[.[] | {id, created_at, tags: (.metadata.container.tags // [])}]')"
          all_versions="$(jq -s 'add | sort_by(.created_at) | reverse' <<<"${raw}")"

          total="$(jq 'length' <<<"${all_versions}")"
          echo "Total versions: ${total}"

          rank=0
          deleted=0
          skipped_protected=0
          skipped_recent=0

          while IFS=$'\t' read -r id created_at tags_csv; do
            rank=$((rank + 1))

            # --- Safety guard #1: a version is a candidate only if it has at
            # least one tag AND every tag matches sha-<12 hex>. Untagged
            # versions (manifest-list children) and any semver/latest
            # release version are protected. ---
            is_candidate=true
            tags_arr=()
            if [[ -z "${tags_csv}" ]]; then
              is_candidate=false
            else
              IFS=',' read -ra tags_arr <<<"${tags_csv}"
              for t in "${tags_arr[@]}"; do
                if ! [[ "${t}" =~ ${TAG_PATTERN} ]]; then
                  is_candidate=false
                  break
                fi
              done
            fi

            if [[ "${is_candidate}" != true ]]; then
              skipped_protected=$((skipped_protected + 1))
              continue
            fi

            # --- Keep the newest N regardless of age. ---
            if (( rank <= KEEP_NEWEST )); then
              continue
            fi

            created_epoch="$(date -u -d "${created_at}" +%s)"
            if (( created_epoch > cutoff_epoch )); then
              skipped_recent=$((skipped_recent + 1))
              continue
            fi

            # --- Safety guard #2: re-verify the exact tag pattern
            # immediately before the delete call (defense in depth). ---
            for t in "${tags_arr[@]}"; do
              if ! [[ "${t}" =~ ${TAG_PATTERN} ]]; then
                echo "REFUSING to delete version ${id}: tag '${t}' failed the final guard" >&2
                exit 1
              fi
            done

            echo "Deleting ${PACKAGE} version id=${id} tags=${tags_csv} created_at=${created_at}"
            gh api --method DELETE "${base}/packages/container/${PACKAGE}/versions/${id}"
            deleted=$((deleted + 1))
          done < <(jq -r '.[] | [.id, .created_at, (.tags | join(","))] | @tsv' <<<"${all_versions}")

          {
            echo "### ghcr cleanup: ${PACKAGE}"
            echo
            echo "- total versions seen: ${total}"
            echo "- deleted (sha-*, rank > ${KEEP_NEWEST}, age > ${MAX_AGE_DAYS}d): ${deleted}"
            echo "- protected (not a pure sha-* tag set, e.g. semver/latest/untagged): ${skipped_protected}"
            echo "- kept (newest ${KEEP_NEWEST} or younger than ${MAX_AGE_DAYS}d): ${skipped_recent}"
          } >> "$GITHUB_STEP_SUMMARY"
