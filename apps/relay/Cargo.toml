[package]
name = "relay"
version = "0.4.13"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "relay core — durable ordered log per subject/shard serving broadcast (replay) and work-queue (lease/ack/redeliver) delivery."

[lib]
name = "relay"
path = "src/lib.rs"

[[bin]]
name = "relay"
path = "src/bin/relay.rs"

[[bench]]
name = "relay_bench"
harness = false

[dependencies]
# The broker core is payload-agnostic (epic #120: "knows nothing about
# workflows"): a message body is carried as opaque JSON. relay stays standalone
# — it depends on no other axiom project, only third-party crates.
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# HTTP/2 (h2c) + OpenAPI transport (#115).
tokio = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
ciborium = "0.2"
crc32fast = "1.4"

# Shared raft driver (#544): RaftHost tick/pump/h2c transport + RaftStore +
# ClusterTopology (k8s downward-API derive) + OutcomeWindow. relay supplies
# only the RelayStateMachine; the hand-rolled driver/store/config are gone.
raft-runtime = { git = "https://github.com/faberline/core", tag = "v0.4.14" }

# Shared service shell (#1205): standard probe routes (/healthz /readyz
# /metrics /openapi.json /docs), the h2c + HTTP/1.1 one-port serve loop,
# SIGTERM-aware graceful drain, and the {error, message} ApiErr envelope.
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared request-auth contract (#1206): Bearer extraction + auth_middleware +
# the role_map StaticRoleMapVerifier implementing RELAY_AUTH=off|required +
# RELAY_TOKEN_REGISTRY_FILE, with the shared {error, message} 401/403 shape.
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Prometheus metric primitives (Counter/Latency + text-format render) for
# RelayMetrics.
metrics-prometheus = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Serve-path tracing init (RUST_LOG wins, else info EnvFilter — keep's pattern).
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# The single `relay` CLI bin (CONTRIBUTING.md CLI convention): clap parsing +
# the standard llm/upgrade/issue ops via the shared cli-std lib. Offline paths
# always build; the HTTPS paths are pulled in by the `self-update`/`issue`
# features via `cli-std/online`.
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", default-features = false }

# K8s operator (feature `operator`) — the shared libs/service-k8s scaffold + render
# toolkit (#1208). relay supplies a RelaySpec CRD + ManagedService and gets the
# reconcile controller for free. Versions mirror the workspace's existing
# kube-rs users (keep / lumen / mambalibs) so the lockfile stays
# single-versioned. Optional so the serving image never links kube-rs unless
# built with `--features operator`.
kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
schemars = { version = "0.8", optional = true }
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.14", optional = true }
# YAML serialization: the generated CRD (`relay k8s crd render` in the operator
# build) and `relay spec --format openapi-yaml` (default build) — unconditional
# since the spec verb shipped (#1209).
serde_yaml = { workspace = true }

# Shared backup contract (#1209, keep #776 / lumen #808): destination/policy
# schema, BackupSink, local + s3 sinks, run_backup_once. Unconditional — the
# schema types and the local sink are cheap; only the HTTP fetch path of
# `relay backup` needs the `backup` feature (reqwest + the lib's s3 sink).
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# Shared peer-mTLS material loading (#1209, lumen #971): PeerTlsConfig env
# contract + PEM loaders + rustls builders + the Once-guarded crypto-provider
# install. Unconditional (links rustls in every build) — src/peer_tls.rs is the
# thin RELAY_PEER-prefix adapter and serve validates material in replica mode.
peer-tls = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# rustls config types surfaced by the peer_tls builder passthroughs. Always in
# the graph via peer-tls, so no longer optional (the private rustls-provider
# feature indirection collapsed; src/tls.rs installs unconditionally).
rustls = "0.23"
# Shared polyglot OpenAPI client codegen (#1209, keep #777): `relay spec gen`
# generates ts/py/rust clients from relay's own utoipa document — offline.
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.4.14", version = "0.5" }
# HTTP client for `relay backup`'s snapshot fetch (feature `backup` only; the
# serving image stays reqwest-free by default). Also a dev-dependency for the
# transport tests either way.
reqwest = { workspace = true, optional = true }

[build-dependencies]
# Stamp RELAY_GIT_SHA / RELAY_BUILT_AT / RELAY_TARGET for cli-std's ToolInfo.
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }

[features]
default = []
# self-update / issue — enable the online (HTTPS) paths of the shared CLI-ops
# lib. Offline builds still ship both commands (`upgrade --check` / the issue
# create dry-run + pre-filled-URL fallback); release builds enable them.
self-update = ["cli-std/online"]
issue = ["cli-std/online"]
# operator — the shared libs/service-k8s scaffold: a RelaySpec CRD + ManagedService
# render, driven by service_k8s::run. Ships the `relay k8s operator run` controller
# and the CRD generator; pulls kube-rs, so the serving image stays kube-free
# unless built with this feature (#1208).
operator = ["dep:kube", "dep:k8s-openapi", "dep:schemars", "dep:service-k8s"]
# backup — `relay backup` (#1209): fetches a snapshot from a running node's
# `GET /admin/backup` over HTTP and ships it to a libs/service-backup
# destination sink (lumen #808 layout). Enables the lib's s3 sink; file://
# always works. The endpoint itself is always served — this gates only the
# CLI verb's HTTP fetch path.
backup = ["dep:reqwest", "service-backup/http-client", "service-backup/s3"]
# otel — enable OTLP trace export in the shared service-http tracing shell.
# The serve flag remains available without this feature and fails clearly if
# an endpoint is configured in a binary that was not built with OTLP support.
otel = ["service-http/otlp"]
# NOTE: the former private `rustls-provider` feature is gone — peer-tls
# links rustls unconditionally now (#1209), so src/tls.rs installs the
# process-level crypto provider in every build.

[dev-dependencies]
# Deploy-CLI render round-trip assertions (tests/deploy_cli.rs, tests/operator.rs).
serde_yaml = { workspace = true }
tempfile = "3"
criterion = "0.5"
# Competitor work-queue comparison harness (examples/bench_compare.rs).
async-nats = { workspace = true }
redis = { version = "0.27", features = ["tokio-comp"] }
lapin = "2.5"
transport-h2c = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# The deterministic consensus simulation (tests/raft_core.rs) drives the core
# directly; production code reaches raft only through raft-runtime.
raft-core = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# h2c test clients for the transport/cluster integration tests.
reqwest = { workspace = true }
rcgen = "0.13"
tower = { workspace = true, features = ["util"] }

[[example]]
name = "bench_compare"
path = "examples/bench_compare.rs"
# HANDWRITE-END
