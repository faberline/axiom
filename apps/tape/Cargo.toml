# <HANDWRITE gap="missing-generator:project-bootstrap" tracker="#768" reason="Initial Tape Rust crate manifest following the Lumen-style service slice.">
[package]
name = "tape"
# tape owns its version and releases independently (tape@<version> tags →
# .github/workflows/tape-release.yml); it no longer inherits the shared
# workspace version.
version = "0.5.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "tape - topic replay journal service"
build = "build.rs"
# Every e2e case is declared below as its own `[[test]]` stanza, so the
# manifest is the inventory: nothing under `e2e/` starts or stops running
# without showing up in a diff (CLAUDE.md "Test Layout").
autotests = false

[lib]
name = "tape"
path = "src/lib.rs"

[[bin]]
name = "tape"
path = "src/bin/tape.rs"

[[bin]]
name = "tape-bench"
path = "src/bin/tape-bench.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.13", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# Shared service shell (#1325): standard probe routes (/healthz /readyz
# /metrics /openapi.json /docs), the h2c + HTTP/1.1 one-port serve loop,
# SIGTERM-aware graceful drain, and the {error, message} ApiErr envelope.
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Prometheus metric primitives (Counter/Latency + text-format render) for
# TapeMetrics.
metrics-prometheus = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Shared bearer-token auth contract (#1326): StaticRoleMapVerifier, the
# blanket auth_middleware, and the registry loader.
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Shared raft driver (#1327): RaftHost/RaftStore/RaftStateMachine,
# ClusterTopology::from_env, OutcomeWindow, SnapshotPolicy/HostConfig, and
# the shared peer-TLS config adapter.
raft-runtime = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Shared peer mTLS material/configuration for the Raft transport.
peer-tls = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# K8s operator (feature `operator`) — the shared libs/service-k8s scaffold + render
# toolkit (#1328), mirroring relay's #1208 slice. tape supplies a TapeSpec CRD +
# ManagedService and gets the reconcile controller for free. Versions mirror
# the workspace's existing kube-rs users (relay / keep / lumen) so the
# lockfile stays single-versioned. Optional so the serving image never links
# kube-rs unless built with `--features operator`.
kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
schemars = { version = "0.8", optional = true }
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.13", optional = true }
axum = { workspace = true }
utoipa = { workspace = true }
# Serve-path tracing init (RUST_LOG wins, else info EnvFilter).
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Shared polyglot OpenAPI client codegen (#1329, relay #1209 pattern): `tape
# spec gen` generates ts/py/rust clients from tape's own openapi_json()
# document — offline, no external tool.
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.4.13", version = "0.5" }
# Shared backup contract (#1329, relay #1209 / lumen #808): destination/policy
# schema, BackupSink, local + s3 sinks, run_backup_once. Unconditional — the
# schema types and the local sink are cheap; only the HTTP fetch path of
# `tape backup` needs the `backup` feature (reqwest + the lib's s3 sink).
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Shared durable file replacement for Tape's Raft marker and journal snapshot
# bytes. Tape retains the domain serialization and recovery ordering.
storage-durable = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# WI #3052 AC1: `bench::run_durable_benchmark` drives the real WAL commit
# coordinator over a real HTTP socket, so it needs a real temp dir and a real
# HTTP client from the library itself (not just from tests) -- both `tape-bench`
# (a normal [[bin]], which cargo never grants dev-dependencies) and
# `e2e/tape_perf_gate.rs` call into it.
tempfile = "3"
reqwest = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
rig = { git = "https://github.com/faberline/rig", rev = "1fbe487eb4a94d745447227dbc974c3eb3e9fbd5" }
tokio = { workspace = true, features = ["full"] }
transport-h2c = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
chrono = { workspace = true }
rcgen = "0.13"

[build-dependencies]
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.13" }

[features]
default = []
self-update = ["cli-std/online"]
issue = ["cli-std/online"]
# operator — the shared libs/service-k8s scaffold: a TapeSpec CRD + ManagedService
# render, driven by operator::run. Ships the `tape k8s operator run` controller
# and the CRD generator; pulls kube-rs, so the serving image stays kube-free
# unless built with this feature (#1328).
operator = ["dep:kube", "dep:k8s-openapi", "dep:schemars", "dep:service-k8s"]
# backup — `tape backup` (#1329): fetches a snapshot from a running node's
# `GET /admin/backup` over HTTP and ships it to a libs/service-backup
# destination sink (relay #1209 layout). Enables the lib's s3 sink; file://
# always works. The endpoint itself is always served — this gates only the
# CLI verb's HTTP fetch path.
backup = ["service-backup/http-client", "service-backup/s3"]
# Optional shared OTLP trace export. No Tape-local exporter exists: this
# enables service-http's stable identity, fallback, and W3C propagation path.
otel = ["service-http/otlp"]
# </HANDWRITE>

# e2e cases — one file per case under `e2e/`, run by `cargo test -p tape`.
# Feature-gated cases name their feature so `cargo test -p tape` skips them
# instead of failing to compile; run those with `--features operator,backup`.

[[test]]
name = "audit_contract"
path = "e2e/audit_contract.rs"

[[test]]
name = "backup"
path = "e2e/backup.rs"
required-features = ["backup"]

