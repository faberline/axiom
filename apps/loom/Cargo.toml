[package]
name = "loom"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "loom — DAG workflow scheduler. Control-plane orchestrator over relay (broker) + keep (store); owns sharded, strongly-consistent workflow/DAG state and never sits in the data path."
# Stamp git sha / build time / target for the standard CLI ops (#475).
build = "build.rs"

[lib]
name = "loom"
path = "src/lib.rs"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
# Explicit hyper auto-server for HTTP/2 cleartext (h2c) + HTTP/1.1 on one port —
# axum::serve alone is HTTP/1-only. (Same as keep/lumen.)
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
async-trait = { workspace = true }
# Bidi h2 stream plumbing for the schema layer (#432): read the request stream
# while writing the response stream.
futures = { workspace = true }
async-stream = { workspace = true }
# relay/keep clients (h2c, no TLS — same as lumen's relay client).
reqwest = { workspace = true }
# Shared HTTP-service shell (archetype): the standard probe routes
# (/healthz /readyz /metrics /openapi.json /docs), the h2c serve loop, and
# SIGTERM-aware graceful drain — composed, not hand-rolled. Pulls h2c (server)
# + utoipa transitively; loom stops hand-rolling the hyper-util accept loop.
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# OpenAPI derive on the control-API DTOs — the /openapi.json + /docs source
# and the `loom spec` offline twin.
utoipa = { workspace = true }
# `loom spec --format openapi-yaml` renders the OpenAPI as YAML (utoipa "4" has
# no yaml feature; same path lumen uses).
serde_yaml = { workspace = true }
# `loom spec gen --lang ts|py|rust` — typed clients from loom's own OpenAPI via
# the shared polyglot core (never a second codegen path).
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.4.13", version = "0.5" }

# --- k8s operator (behind the `operator` feature) ---------------------------
# The reconcile controller + CRD derivation + backup runner. Kept optional so
# the serving image never links kube-rs unless it is the operator/backup image.
kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
schemars = { version = "0.8", optional = true }
# Shared operator scaffold: ManagedService, render helpers (sharded StatefulSet
# with the downward-API env raft-host reads), leader-election, the controller.
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.13", optional = true }
# Shared backup contract: destination/policy/sink/runner for `loom backup`.
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.13", optional = true }
tracing-subscriber = { workspace = true, optional = true }
# Shared Raft consensus engine for replicated workflow state (#110). The
# in-process cluster tests drive `raft_core` directly; production goes through
# the `raft-host` driver below.
raft-core = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Shared raft HOST (#546): the tick/pump loop, h2c peer transport,
# snapshot + log compaction, read-your-write propose, and k8s auto-mode. loom
# supplies a `RaftStateMachine` (LoomSm) and gets HA + the backup layer for
# free — replacing loom's two hand-rolled raft stacks.
raft-runtime = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Scoped claim-check tokens the schema layer signs for workers (#444).
claim-token = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
# Standard agent-facing CLI ops — llm/upgrade/issue (#475). Offline paths
# always build; the network paths are gated behind loom's online features below.
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.13", default-features = false }

[features]
default = []
# k8s operator + backup runner: the `loom k8s operator run` reconcile controller,
# CRD derivation for `loom k8s crd render`, and the `loom backup` runner. The
# `k8s ... render` verbs work without this (offline templates); only CRD
# derivation + `operator run` + `backup` need it. The production image builds
# with it.
operator = [
  "dep:kube",
  "dep:k8s-openapi",
  "dep:schemars",
  "dep:service-k8s",
  "dep:service-backup",
  "dep:tracing-subscriber",
]
# Online (HTTPS) paths of the standard CLI ops (#475): `upgrade` self-install +
# `issue` search/view/create. Offline paths (llm, `upgrade --check`, `issue
# create --dry-run`) always build; release builds enable these.
self-update = ["cli-std/online"]
issue = ["cli-std/online"]
