# <HANDWRITE gap="missing-generator:project-bootstrap" tracker="#pgpool-bootstrap" reason="Initial working-name app scaffold before pgpool has a generated TD source unit.">
[package]
name = "pgpool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "working-name PostgreSQL pooler service built on server-lifecycle/server-tcp/server-http"
build = "build.rs"

[lib]
name = "pgpool"
path = "src/lib.rs"

[[bin]]
name = "pgpool"
path = "src/bin/pgpool.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["env"] }
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.13", default-features = false }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
metrics-prometheus = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
mio = { version = "0.8", features = ["net", "os-poll"] }
schemars = "0.8"
server-http = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
server-lifecycle = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
server-tcp = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tracing = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
transport-h2c = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
http-body-util = "0.1"
reqwest = { workspace = true }
tower = { workspace = true }

[build-dependencies]
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.13" }

[features]
default = []
self-update = ["cli-std/online"]
issue = ["cli-std/online"]
# </HANDWRITE>
