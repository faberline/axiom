# <HANDWRITE gap="mesh-cli-shell-scaffold" tracker="#1970" reason="Initial Mesh Rust crate manifest: CLI shell only, no graph engine yet.">
[package]
name = "mesh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "mesh - relationship/property-graph service"
build = "build.rs"

[lib]
name = "mesh"
path = "src/lib.rs"

[[bin]]
name = "mesh"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }

# Shared standard CLI ops (llm / upgrade / issue). `online` is on so the
# released binary can self-update and file issues.
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", features = ["online"] }

[build-dependencies]
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
# </HANDWRITE>
