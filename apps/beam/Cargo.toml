[package]
name = "beam"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "beam — GPU-native vector database. Owns GPU ANN vector storage, index lifecycle, batch ingest, and vector query execution; distinct from lumen (mixed search / ranking / dedup)."
# Stamp git sha / build time / target for the standard CLI ops (llm/upgrade/issue).
build = "build.rs"

[lib]
name = "beam"
path = "src/lib.rs"

[[bin]]
name = "beam"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["env"] }
# The async standard-CLI ops (`upgrade`/`issue`) are driven from a minimal
# block_on runtime, exactly like loom — main stays sync.
tokio = { workspace = true }
# Standard agent-facing CLI ops — llm/upgrade/issue (the CONTRIBUTING.md CLI
# convention). Offline paths always build; the network paths are gated behind
# beam's online features below.
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.13", default-features = false, features = ["k8s"] }
reqwest = { workspace = true, features = ["blocking", "json"] }

# --- Real GPU vector-search engine ---------------------------------------
# GPU compute via wgpu (Metal on macOS). Pinned to the SAME major already in
# the workspace lock (24.x) as `crates/cclab-grid-render-webgpu`, so the shared
# Cargo.lock resolves without a second wgpu copy. `vulkan-portability` also
# compiles the VULKAN backend on macOS (loader + MoltenVK), so the same wgpu
# Vulkan path NVIDIA uses can be runtime-verified on a Mac via
# `BEAM_WGPU_BACKEND=vulkan` (see benchmark/dual-platform.md).
wgpu = { version = "24", features = ["vulkan-portability"] }
# f32 <-> bytes for GPU buffer uploads/readback (`Pod`/`Zeroable` derives).
bytemuck = { version = "1", features = ["derive"] }
# Block on wgpu's async `request_adapter` / `request_device` from sync code.
pollster = "0.4"

# --- Native CUDA backend (optional, `--features cuda`) -------------------
# NVIDIA the CUDA-native way, behind the `cuda` feature — NOT in the default
# build (Mac/CI stays wgpu-only and pulls no cudarc). `dynamic-loading` dlopen's
# libcuda / libnvrtc at RUNTIME (no CUDA toolkit needed at build time) and
# `nvrtc` compiles the distance kernel at runtime on the NVIDIA host, so this
# COMPILES on this Mac (aarch64-apple-darwin) even with no NVIDIA driver present;
# it only *runs* on an NVIDIA GPU + driver. `cuda-12060` pins the driver API
# surface. See `src/index/cuda.rs`.
cudarc = { version = "0.16", default-features = false, features = ["cuda-12060", "dynamic-loading", "driver", "nvrtc"], optional = true }

# --- HNSW graph ANN index (CPU) ------------------------------------------
# The pure-Rust HNSW backend behind `HnswIndex`. Pinned to the SAME version +
# features lumen uses (`projects/lumen`), so the shared workspace Cargo.lock
# resolves ONE hnsw_rs/anndists copy. `simdeez_f` compiles anndists' SIMD
# distance kernels (aarch64 NEON `asimd`, x86 AVX2/SSE2) for DistL2/DistDot.
hnsw_rs = { version = "0.3", features = ["simdeez_f"] }

# --- Durable persistence (save/load) -------------------------------------
# Serialize the CPU-side source-of-truth (collection segment + trained IVF-PQ
# model) to disk so a cold load reproduces identical search results without
# retraining. GPU buffers are ephemeral and rebuilt on load, never persisted.
# `serde` is the workspace-pinned 1.0 (derive on the persisted structs);
# `bincode` 1.3 is the compact, non-self-describing codec already used by keep /
# compass / cclab-grid, so the shared Cargo.lock resolves the SAME 1.3.3.
serde = { workspace = true }
bincode = "1.3"

# --- HTTP/2 (h2c) service layer (`beam serve`) ---------------------------
# The REST front end over the engine: an axum router served on one port as
# HTTP/1.1 + HTTP/2 cleartext (h2c) via the shared `h2c` transport (the
# ecosystem's drop-in for `axum::serve`, which is HTTP/1 only — same setup as
# keep / loom / lumen). `axum` / `serde_json` inherit the workspace pins so the
# shared Cargo.lock stays single-versioned.
axum = { workspace = true }
serde_json = { workspace = true }
h2c = { package = "transport-h2c", git = "https://github.com/faberline/core", tag = "v0.4.13", features = ["server"] }
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
storage-durable = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
server-lifecycle = { git = "https://github.com/faberline/core", tag = "v0.4.13" }
utoipa = { workspace = true, features = ["axum_extras"] }
serde_yaml = { workspace = true }
ciborium = "0.2"
lz4_flex = "0.11"
lz4 = { version = "1.24", optional = true } # (optional, if any code demands it, but lz4_flex is standard)

[dev-dependencies]
# Drive the `beam serve` REST API end-to-end from the service integration test
# (plain HTTP/1.1 over the h2c port). Inherits the workspace reqwest pin.
reqwest = { workspace = true }

[features]
default = []
# Native CUDA backend (`CudaFlatIndex`, `src/index/cuda.rs`). Off by default so
# the Mac/CI build pulls no cudarc; compile-check it with
# `cargo check -p beam --features cuda`. Runtime requires an NVIDIA GPU + driver.
cuda = ["dep:cudarc"]
# Online (HTTPS) paths of the standard CLI ops: `upgrade` self-install and
# `issue` search/view/create submit. Offline paths (llm, `upgrade --check`,
# `issue create --dry-run` / pre-filled-URL fallback) always build; release
# builds enable these.
self-update = ["cli-std/online"]
issue-online = ["cli-std/online"]
